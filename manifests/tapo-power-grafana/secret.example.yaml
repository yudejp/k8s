apiVersion: v1
kind: Secret
metadata:
  name: tapo-power-grafana
type: Opaque
stringData:
  TAPO_USERNAME: "tapo-collector@example.com"
  TAPO_PASSWORD: "replace-me"
  # Generate once with `uuidgen` and never change it after terminal verification.
  TAPO_TERMINAL_ID: "00000000-0000-4000-8000-000000000001"
  # Leave empty normally. Set only while the first terminal verification waits.
  TAPO_MFA_CODE: ""
  # Empty means every discovered Tapo energy device.
  TAPO_DEVICE_IDS: ""
  GRAFANA_OTLP_ENDPOINT: "https://otlp-gateway-<zone>.grafana.net/otlp"
  GRAFANA_OTLP_INSTANCE_ID: "replace-me"
  GRAFANA_CLOUD_TOKEN: "replace-me"
