apiVersion: apps/v1
kind: Deployment
metadata:
  name: tapo-power-grafana
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tapo-power-grafana
  template:
    metadata:
      labels:
        app: tapo-power-grafana
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: ghcr.io/yude/tplink-tapo-power-grafana-cloud:e0a9891@sha256:17c111dd130d621100e9d9a95ea8958c726b797cdacddcdbdf9e9c5a2060463e
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: tapo-power-grafana
          env:
            - name: COLLECTION_INTERVAL
              value: 5m
            - name: HISTORY_INTERVAL
              value: 24h
            - name: HISTORY_ON_START
              value: "true"
            - name: LISTEN_ADDRESS
              value: :8080
            - name: REQUEST_TIMEOUT
              value: 30s
            - name: TAPO_MFA_CODE_FILE
              value: /var/run/secrets/tapo/TAPO_MFA_CODE
            - name: TAPO_MFA_WAIT_TIMEOUT
              value: 10m
            - name: TZ
              value: Asia/Tokyo
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            failureThreshold: 3
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: tapo-mfa-code
              mountPath: /var/run/secrets/tapo
              readOnly: true
      volumes:
        - name: tapo-mfa-code
          secret:
            secretName: tapo-power-grafana
            defaultMode: 0440
            items:
              - key: TAPO_MFA_CODE
                path: TAPO_MFA_CODE
