apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-vip-control-plane
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-vip
    app.kubernetes.io/component: control-plane-vip
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-vip-control-plane
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-vip
    app.kubernetes.io/component: control-plane-vip
rules:
  # Leader election creates the named Lease if it does not exist yet.
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
  # All other operations are restricted to the control-plane Lease.
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    resourceNames:
      - kube-vip-control-plane
    verbs:
      - get
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-vip-control-plane
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-vip
    app.kubernetes.io/component: control-plane-vip
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-vip-control-plane
subjects:
  - kind: ServiceAccount
    name: kube-vip-control-plane
    namespace: kube-system
