apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

nameSuffix: -nrt1kwo3

resources:
  - ../../base

patches:
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: kube-vip
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: kube-vip
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/instance: nrt1kwo3
        template:
          metadata:
            labels:
              app.kubernetes.io/instance: nrt1kwo3
          spec:
            nodeSelector:
              kubernetes.io/hostname: nrt1kwo3
            containers:
              - name: kube-vip
                env:
                  - name: vip_interface
                    value: ens19
