apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-vip
    app.kubernetes.io/component: control-plane-vip
    app.kubernetes.io/version: v1.2.3
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip
      app.kubernetes.io/component: control-plane-vip
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip
        app.kubernetes.io/component: control-plane-vip
        app.kubernetes.io/version: v1.2.3
    spec:
      automountServiceAccountToken: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      serviceAccountName: kube-vip-control-plane
      terminationGracePeriodSeconds: 10
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v1.2.3@sha256:2fcdbb014a2e217b9ea1b6dacac53d6851b185af323cdd28d100ad82d74bc79a
          imagePullPolicy: IfNotPresent
          args:
            - manager
          env:
            # Force in-cluster authentication to use this node's API server.
            # This avoids dependencies on the VIP, Service networking, CNI,
            # DNS, and kube-proxy while kube-vip is acquiring its Lease.
            - name: KUBERNETES_SERVICE_HOST
              value: 127.0.0.1
            - name: KUBERNETES_SERVICE_PORT
              value: "6443"
            - name: vip_nodename
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            # Provide only the control-plane VIP; do not manage Services or
            # enable kube-vip's IPVS load balancer.
            - name: cp_enable
              value: "true"
            - name: svc_enable
              value: "false"
            - name: lb_enable
              value: "false"
            - name: address
              value: 192.168.30.233
            - name: port
              value: "6443"
            - name: vip_subnet
              value: "32"
            - name: vip_arp
              value: "true"

            # Kubernetes Lease election ties ownership to an API server that
            # can still write to the embedded-etcd quorum.
            - name: vip_leaderelection
              value: "true"
            - name: vip_leasename
              value: kube-vip-control-plane
            - name: cp_namespace
              value: kube-system
            - name: vip_leaseduration
              value: "15"
            - name: vip_renewdeadline
              value: "10"
            - name: vip_retryperiod
              value: "2"
            - name: vip_preserve_on_leadership_loss
              value: "false"
            - name: vip_loseleadership
              value: "true"
            - name: vip_loseleadership_timeout_seconds
              value: "10"

            # Interface is intentionally omitted. The three current servers
            # use different device names, so kube-vip must select the device
            # whose route reaches the VIP subnet.
            - name: vip_arpRate
              value: "3000"
            - name: prometheus_server
              value: ""
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
